<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum - Hyperion World Cup</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --bg-color: #080f18;
            --gold: #ffd700;
            --gold-light: #fff3a8;
            --burgundy: #500116;
            --burgundy-dark: #1f0007;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #13243a 0%, #080f18 100%);
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 20px 40px;
            color: white;
        }

        .page-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            z-index: 50;
            background: rgba(8, 15, 24, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
        }

        .header-left {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 6px;
            background: linear-gradient(to right, #ffffff 0%, #ffffff 25%, var(--gold-light) 40%, var(--gold) 50%, var(--gold-light) 60%, #ffffff 75%, #ffffff 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 3px rgba(0, 0, 0, 0.8));
            display: flex;
            align-items: center;
            gap: 10px;
            animation: headerShimmer 4s ease-in-out infinite;
        }

        @keyframes headerShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
            display: block;
            -webkit-text-fill-color: initial;
            animation: spinLogo 3s linear infinite;
            transform-style: preserve-3d;
            perspective: 200px;
        }

        @keyframes spinLogo {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .header-right {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--gold-light);
            opacity: 0.7;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ball-spin {
            width: 28px;
            height: 28px;
            object-fit: contain;
            display: block;
            animation: spinBall 3s linear infinite;
        }

        @keyframes spinBall {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .album-title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 10px 0 6px;
            background: linear-gradient(to bottom, #ffffff 40%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 3px rgba(0, 0, 0, 0.8));
        }

        .album-counter {
            font-size: 14px;
            color: #828e9a;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .album-counter span {
            color: var(--gold);
            font-weight: 800;
        }

        .album-nav {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .album-nav a {
            padding: 8px 20px;
            border: 2px solid var(--gold);
            color: var(--gold);
            text-decoration: none;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .album-nav a:hover {
            background: var(--gold);
            color: black;
            box-shadow: 0 0 12px var(--gold);
        }

        .album-nav a.active {
            background: var(--gold);
            color: black;
        }

        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            padding: 6px 16px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #828e9a;
            border-radius: 12px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .filter-btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .filter-btn.active {
            border-color: var(--gold);
            background: rgba(255, 215, 0, 0.1);
            color: var(--gold);
        }

        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 14px;
            width: 100%;
            max-width: 1100px;
        }

        .album-slot {
            aspect-ratio: 2.5 / 3.5;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: default;
        }

        .album-slot.collected {
            border: 2px solid var(--gold);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.15);
        }

        .album-slot.collected:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
        }

        .album-slot.missing {
            border: 2px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
        }

        .album-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .slot-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 2;
        }

        .slot-badge.normal {
            background: #cbd5e1;
            color: #000;
        }

        .slot-badge.escudo {
            background: #a855f7;
            color: #fff;
        }

        .slot-badge.especial {
            background: #00d2ff;
            color: #000;
        }

        .slot-badge.legendaria {
            background: var(--gold);
            color: #000;
            text-shadow: 0 0 2px white;
        }

        .slot-check {
            position: absolute;
            bottom: 6px;
            right: 6px;
            width: 22px;
            height: 22px;
            background: var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #000;
            font-weight: 900;
            z-index: 2;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .missing-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            color: rgba(255, 255, 255, 0.15);
        }

        .missing-content .qmark {
            font-size: 32px;
            font-weight: 900;
        }

        .missing-content .mini-rarity {
            font-size: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.1);
        }

        .slot-name {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px 6px 6px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
            font-size: 9px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.5px;
            color: #fff;
            z-index: 1;
        }

        .album-slot.missing .slot-name {
            color: rgba(255, 255, 255, 0.25);
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-5vh) scale(1); opacity: 0; }
        }

        .reset-btn {
            margin-top: 30px;
            padding: 8px 22px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #828e9a;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .reset-btn:hover {
            border-color: var(--burgundy);
            color: #ff6b6b;
        }
    </style>
</head>

<body>

    <div class="particles" id="particles"></div>

    <div class="page-header">
        <span class="header-left"><img class="header-logo" src="imagenes/carta.png" alt=""> HYPERION</span>
        <span class="header-right"><img class="ball-spin" src="imagenes/trionda.png" alt=""> #HyperionWorldCup</span>
    </div>

    <h1 class="album-title">Álbum de Colección</h1>
    <div class="album-counter"><span id="collectedCount">0</span> / <span id="totalCount">0</span> coleccionadas</div>

    <div class="album-nav">
        <a href="index.html">⬅ Abrir Sobres</a>
        <a href="album.html" class="active">📖 Álbum</a>
    </div>

    <div class="filters" id="filters">
        <button class="filter-btn active" data-filter="all">Todas</button>
        <button class="filter-btn" data-filter="normal">⬤ Normal</button>
        <button class="filter-btn" data-filter="escudo">⬤ Escudo</button>
        <button class="filter-btn" data-filter="especial">⬤ Especial</button>
        <button class="filter-btn" data-filter="legendaria">⬤ Legendaria</button>
    </div>

    <div class="album-grid" id="albumGrid"></div>

    <button class="reset-btn" onclick="resetColeccion()">Reiniciar Colección</button>

    <script>
        const poolCartas = [
            { id: 1, name: "Ester", rarity: "normal", img: "imagenes/Carta base/Ester-base.jpg" },
            { id: 2, name: "Hannah", rarity: "normal", img: "imagenes/Carta base/Hannah-base.jpg" },
            { id: 3, name: "Osita", rarity: "normal", img: "imagenes/Carta base/Osita-base.jpg" },
            { id: 4, name: "Jade", rarity: "normal", img: "imagenes/Carta base/Jade-base.jpg" },
            { id: 5, name: "Miubi", rarity: "normal", img: "imagenes/Carta base/Miubi-base.jpg" },
            { id: 6, name: "Loore", rarity: "normal", img: "imagenes/Carta base/Loore-base.jpg" },
            { id: 7, name: "Jora", rarity: "normal", img: "imagenes/Carta base/Jora-base.jpg" },
            { id: 8, name: "Ester", rarity: "especial", img: "imagenes/Carta especial/Ester-especial.jpg" },
            { id: 9, name: "Night", rarity: "legendaria", img: "imagenes/Carta legendaria/Night-legendaria.jpg" },
            { id: 10, name: "Fiire", rarity: "legendaria", img: "imagenes/Carta legendaria/Fiire-legendaria.jpg" },
            { id: 11, name: "Hannah", rarity: "especial", img: "imagenes/Carta especial/Hannah-especial.jpg" },
            { id: 12, name: "Jora", rarity: "especial", img: "imagenes/Carta especial/Jora-especial.jpg" },
            { id: 13, name: "Lana", rarity: "especial", img: "imagenes/Carta especial/Lana-especial.jpg" },
            { id: 14, name: "Blon", rarity: "normal", img: "imagenes/Carta base/Blon-base.jpg" },
            { id: 15, name: "Fueguitos", rarity: "normal", img: "imagenes/Carta base/Fueguitos-base.jpg" },
            { id: 16, name: "Syd", rarity: "normal", img: "imagenes/Carta base/Syd-base.jpg" },
            { id: 17, name: "Blon", rarity: "especial", img: "imagenes/Carta especial/Blon-especial.jpg" },
            { id: 18, name: "Fueguitos", rarity: "especial", img: "imagenes/Carta especial/Fueguitos-especial.jpg" },
            { id: 19, name: "Jade", rarity: "especial", img: "imagenes/Carta especial/Jade-especial.jpg" },
            { id: 20, name: "Miubi", rarity: "especial", img: "imagenes/Carta especial/Miubi-especial.jpg" },
            { id: 21, name: "Syd", rarity: "especial", img: "imagenes/Carta especial/Syd-especial.jpg" },
            { id: 22, name: "Alma", rarity: "legendaria", img: "imagenes/Carta legendaria/Alma-legendaria.jpg" },
            { id: 23, name: "Jora", rarity: "legendaria", img: "imagenes/Carta legendaria/Jora-legendaria.jpg" },
            { id: 24, name: "Loore", rarity: "legendaria", img: "imagenes/Carta legendaria/Loore-legendaria.jpg" },
            { id: 25, name: "Hannah", rarity: "legendaria", img: "imagenes/Carta legendaria/Hannah-legendaria.jpg" },
            { id: 26, name: "Fiire", rarity: "normal", img: "imagenes/Carta base/Fiire-base.jpg" },
            { id: 27, name: "Fiire", rarity: "especial", img: "imagenes/Carta especial/Fiire-especial.jpg" },
            { id: 28, name: "Night", rarity: "normal", img: "imagenes/Carta base/Night-base.jpg" },
            { id: 29, name: "Vaquita", rarity: "normal", img: "imagenes/Carta base/Vaquita-base.jpg" },
            { id: 30, name: "Vaquita", rarity: "especial", img: "imagenes/Carta especial/Vaquita-especial.jpg" },
            { id: 31, name: "Osita", rarity: "especial", img: "imagenes/Carta especial/Osita-especial.jpg" },
            { id: 32, name: "Cr7", rarity: "normal", img: "imagenes/Carta base/Cr7-base.jpg" },
            { id: 33, name: "Ever", rarity: "normal", img: "imagenes/Carta base/Ever-base.jpg" },
            { id: 34, name: "John", rarity: "normal", img: "imagenes/Carta base/John-base.jpg" },
            { id: 35, name: "Irwin", rarity: "normal", img: "imagenes/Carta base/Irwin-base.jpg" },
            { id: 36, name: "Enzo", rarity: "normal", img: "imagenes/Carta base/Enzo-base.jpg" },
            { id: 37, name: "Fede", rarity: "normal", img: "imagenes/Carta base/Fede-base.jpg" },
            { id: 38, name: "John", rarity: "especial", img: "imagenes/Carta especial/John-especial.jpg" },
            { id: 39, name: "Irwin", rarity: "especial", img: "imagenes/Carta especial/Irwin-especial.jpg" },
            { id: 40, name: "Ever", rarity: "especial", img: "imagenes/Carta especial/Ever-especial.jpg" },
            { id: 41, name: "Enzo", rarity: "especial", img: "imagenes/Carta especial/Enzo-especial.jpg" },
            { id: 42, name: "Cr7", rarity: "especial", img: "imagenes/Carta especial/Cr7-especial.jpg" },
            { id: 43, name: "Hyperion", rarity: "escudo", img: "imagenes/escudos/Hyperion-escudo.jpg" },
            { id: 44, name: "Argentina", rarity: "escudo", img: "imagenes/escudos/Argentina-escudo.jpg" },
            { id: 45, name: "Brasil", rarity: "escudo", img: "imagenes/escudos/Brasil-escudo.jpg" },
            { id: 46, name: "Italia", rarity: "escudo", img: "imagenes/escudos/Italia-escudo.jpg" },
            { id: 47, name: "Colombia", rarity: "escudo", img: "imagenes/escudos/Colombia-escudo.jpg" },
            { id: 48, name: "México", rarity: "escudo", img: "imagenes/escudos/Escudo-mexico.jpg" },
            { id: 49, name: "El Salvador", rarity: "escudo", img: "imagenes/escudos/El-Salvador-escudo.jpg" },
            { id: 50, name: "Uruguay", rarity: "escudo", img: "imagenes/escudos/Uruguay-escudo.jpg" },
            { id: 51, name: "Balón Oficial", rarity: "legendaria", img: "imagenes/Carta legendaria/Balon-Oficial.jpg" },
            { id: 52, name: "Trofeo Oficial", rarity: "legendaria", img: "imagenes/Carta legendaria/Trofeo-Oficial.jpg" },
            { id: 53, name: "Lana", rarity: "normal", img: "imagenes/Carta base/Lana-base.jpg" }
        ];

        let filtroActual = 'all';

        function getColeccion() {
            try {
                return JSON.parse(localStorage.getItem('hyperion_coleccion')) || [];
            } catch { return []; }
        }

        function renderAlbum() {
            const grid = document.getElementById('albumGrid');
            const coleccion = getColeccion();
            const total = poolCartas.length;
            const coleccionadas = coleccion.length;

            document.getElementById('collectedCount').textContent = coleccionadas;
            document.getElementById('totalCount').textContent = total;

            const filtradas = filtroActual === 'all'
                ? poolCartas
                : poolCartas.filter(c => c.rarity === filtroActual);

            grid.innerHTML = '';
            filtradas.forEach(carta => {
                const tiene = coleccion.includes(carta.id);
                const slot = document.createElement('div');
                slot.className = `album-slot ${tiene ? 'collected' : 'missing'}`;

                if (tiene && carta.img) {
                    const img = document.createElement('img');
                    img.src = carta.img;
                    img.alt = carta.name;
                    img.loading = 'lazy';
                    slot.appendChild(img);
                } else if (tiene && !carta.img) {
                    const img = document.createElement('img');
                    img.src = 'imagenes/carta.png';
                    img.alt = carta.name;
                    img.style.objectFit = 'contain';
                    img.style.padding = '20px';
                    img.style.opacity = '0.5';
                    slot.appendChild(img);
                } else {
                    const div = document.createElement('div');
                    div.className = 'missing-content';
                    div.innerHTML = `
                        <div class="qmark">?</div>
                        <div class="mini-rarity">${carta.rarity}</div>
                    `;
                    slot.appendChild(div);
                }

                const badge = document.createElement('div');
                badge.className = `slot-badge ${carta.rarity}`;
                badge.textContent = carta.rarity;
                slot.appendChild(badge);

                if (tiene) {
                    const check = document.createElement('div');
                    check.className = 'slot-check';
                    check.textContent = '✓';
                    slot.appendChild(check);
                }

                const name = document.createElement('div');
                name.className = 'slot-name';
                name.textContent = carta.name;
                slot.appendChild(name);

                grid.appendChild(slot);
            });
        }

        function resetColeccion() {
            Swal.fire({
                title: '¿Reiniciar colección?',
                text: 'Se perderán todas las cartas guardadas.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#500116',
                cancelButtonColor: '#6b7280',
                confirmButtonText: 'Sí, reiniciar',
                cancelButtonText: 'Cancelar',
                background: '#0f172a',
                color: '#fff',
                iconColor: '#ffd700'
            }).then(result => {
                if (result.isConfirmed) {
                    localStorage.removeItem('hyperion_coleccion');
                    renderAlbum();
                    Swal.fire({
                        title: 'Reiniciada',
                        text: 'Tu colección ha sido reiniciada.',
                        icon: 'success',
                        confirmButtonColor: '#500116',
                        background: '#0f172a',
                        color: '#fff',
                        timer: 1500,
                        showConfirmButton: false
                    });
                }
            });
        }

        document.getElementById('filters').addEventListener('click', e => {
            const btn = e.target.closest('.filter-btn');
            if (!btn) return;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filtroActual = btn.dataset.filter;
            renderAlbum();
        });

        function crearParticulas() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                p.style.left = Math.random() * 100 + '%';
                const size = 1 + Math.random() * 3;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.animationDuration = (10 + Math.random() * 20) + 's';
                p.style.animationDelay = (Math.random() * 20) + 's';
                p.style.background = Math.random() > 0.7 ? 'var(--gold)' : 'rgba(255,255,255,0.6)';
                container.appendChild(p);
            }
        }
        crearParticulas();
        renderAlbum();
    </script>
</body>

</html>
