<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundial de Cartas - Premium Gacha</title>
    <style>
        :root {
            --bg-color: #080f18;
            --gold: #ffd700;
            --gold-light: #fff3a8;
            --burgundy: #500116;
            --burgundy-dark: #1f0007;
            --foil-shine: linear-gradient(115deg,
                    rgba(255, 255, 255, 0) 30%,
                    rgba(255, 255, 255, 0.4) 48%,
                    rgba(255, 215, 0, 0.6) 50%,
                    rgba(255, 255, 255, 0.4) 52%,
                    rgba(255, 255, 255, 0) 70%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #13243a 0%, #080f18 100%);
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            color: white;
        }

        .stage {
            position: relative;
            width: 100%;
            max-width: 1100px;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 2000px;
        }

        /* --- SOBRE (PACK) --- */
        .pack-wrapper {
            position: absolute;
            z-index: 10;
            transition: transform 0.9s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.6s ease;
            transform-style: preserve-3d;
        }

        .pack {
            width: 310px;
            height: 450px;
            background: linear-gradient(145deg, var(--burgundy) 0%, var(--burgundy-dark) 100%);
            border: 4px solid var(--gold);
            border-radius: 14px;
            position: relative;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .pack::after {
            content: '';
            position: absolute;
            top: -150%;
            left: -150%;
            width: 400%;
            height: 400%;
            background: var(--foil-shine);
            transform: rotate(25deg);
            animation: packShine 5s infinite linear;
            pointer-events: none;
        }

        @keyframes packShine {
            0% {
                transform: translate(-20%, -20%) rotate(25deg);
            }

            100% {
                transform: translate(20%, 20%) rotate(25deg);
            }
        }

        .pack:hover {
            transform: scale(1.04) rotateY(10deg) rotateX(5deg);
            box-shadow: 0 40px 70px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 215, 0, 0.2);
        }

        .crimp {
            position: absolute;
            left: 0;
            width: 100%;
            height: 16px;
            background: repeating-linear-gradient(90deg, #2c000a, #2c000a 4px, var(--gold) 4px, var(--gold) 8px);
            border-bottom: 2px solid rgba(0, 0, 0, 0.5);
            z-index: 5;
        }

        .crimp-top {
            top: 0;
        }

        .crimp-bottom {
            bottom: 0;
            border-bottom: none;
            border-top: 2px solid rgba(0, 0, 0, 0.5);
        }

        .pack-layout {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            text-align: center;
        }

        .fifa-logo {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 3px 12px;
            border-radius: 3px;
            background: rgba(0, 0, 0, 0.2);
        }

        .pack-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(to bottom, #ffffff 40%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 3px rgba(0, 0, 0, 0.8));
        }

        .logo-center-box {
            width: 220px;
            height: 260px;
            background: radial-gradient(circle, rgba(138, 0, 37, 0.6) 0%, rgba(0, 0, 0, 0.5) 100%);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid var(--gold);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
            overflow: hidden;
        }

        .logo-center-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .pack-edition {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.25), transparent);
            width: 100%;
            padding: 5px 0;
            border-top: 1px solid rgba(255, 215, 0, 0.2);
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }

        .pack-footer {
            font-size: 11px;
            font-weight: 600;
            color: var(--gold-light);
        }

        /* --- ESTADO ABIERTO --- */
        .stage.opened .pack-wrapper {
            transform: translateY(-700px) scale(0.4) rotateX(60deg);
            opacity: 0;
            pointer-events: none;
        }

        /* --- CARTAS --- */
        .cards-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.75);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .stage.opened .cards-container {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        .card-wrapper {
            width: 195px;
            height: 280px;
            flex-shrink: 0;
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: cardFlip 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards;
        }

        @keyframes cardFlip {
            0% {
                transform: rotateY(180deg) translateY(40px) scale(0.85);
            }
            100% {
                transform: rotateY(0deg) translateY(0) scale(1);
            }
        }

        .card-front,
        .card-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
        }

        .card-back {
            background: linear-gradient(145deg, var(--burgundy) 0%, var(--burgundy-dark) 100%);
            border: 3px solid var(--gold);
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .card-back::after {
            content: '';
            position: absolute;
            top: -150%;
            left: -150%;
            width: 400%;
            height: 400%;
            background: var(--foil-shine);
            transform: rotate(25deg);
            animation: packShine 5s infinite linear;
            pointer-events: none;
        }

        .card-back-logo {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 3px 12px;
            border-radius: 3px;
            background: rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .card-back-title {
            font-size: 18px;
            font-weight: 900;
            color: var(--gold);
            text-align: center;
            z-index: 1;
            filter: drop-shadow(2px 2px 3px rgba(0, 0, 0, 0.8));
        }

        .card-back-stars {
            font-size: 20px;
            color: var(--gold);
            letter-spacing: 6px;
            z-index: 1;
        }

        .card-back-footer {
            font-size: 9px;
            font-weight: 600;
            color: var(--gold-light);
            z-index: 1;
        }

        .card-wrapper:hover .card-inner {
            transform: scale(1.22) translateY(-35px);
            z-index: 10;
            transition: transform 0.3s ease;
        }

        .card-wrapper:hover .card-front {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }

        .card {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #111d2c 0%, #070d14 100%);
            border: 3px solid #cbd5e1;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
        }

        .card.full-img {
            padding: 0;
            background: none;
            justify-content: flex-end;
        }

        .card.full-img > .card-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 9px;
            z-index: 0;
        }

        .card.full-img .card-header,
        .card.full-img .card-photo-area {
            display: none;
        }

        .card.full-img .player-data {
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            border: none;
            border-radius: 0 0 9px 9px;
            padding: 30px 10px 10px;
            margin-top: auto;
            position: relative;
            z-index: 1;
        }

        .card.full-img .player-meta,
        .card.full-img .stats-grid,
        .card.full-img .player-name {
            display: none;
        }

        .card.full-img .silhouette {
            display: none;
        }

        /* DISEÑO DE CARTAS SEGÚN RAREZA */
        .card.rarity-escudo {
            border-color: #a855f7;
            background: linear-gradient(135deg, #1a0e2e 0%, #0d0518 100%);
        }

        .card.rarity-especial {
            border-color: #00d2ff;
            background: linear-gradient(135deg, #0c2540 0%, #040e1a 100%);
        }

        /* DISEÑO ESPECIAL INTERACTIVO: LEGENDARIA */
        .card.rarity-legendaria {
            border-color: var(--gold);
            background: linear-gradient(135deg, #2b040e 0%, #460517 50%, #110006 100%);
            animation: cardGlowLegendary 3s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Efecto destello aura dorada */
        @keyframes cardGlowLegendary {
            0% {
                box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5), 0 0 10px rgba(255, 215, 0, 0.3);
            }

            100% {
                box-shadow: 0 25px 45px rgba(0, 0, 0, 0.6), 0 0 25px rgba(255, 215, 0, 0.8), 0 0 40px rgba(255, 243, 168, 0.4);
            }
        }

        /* Brillo de barrido holográfico constante para leyendas */
        .card.rarity-legendaria::after {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0) 40%, rgba(255, 255, 255, 0.4) 50%, rgba(255, 215, 0, 0.3) 55%, rgba(255, 255, 255, 0) 65%);
            transform: rotate(15deg);
            animation: holoSweep 4s infinite ease-in-out;
            pointer-events: none;
            z-index: 4;
        }

        @keyframes holoSweep {
            0% {
                transform: translate(-20%, -20%) rotate(15deg);
            }

            100% {
                transform: translate(20%, 20%) rotate(15deg);
            }
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.25) 50%, rgba(255, 255, 255, 0) 100%);
            background-size: 200% 200%;
            background-position: -100% -100%;
            transition: background-position 0.5s ease;
            z-index: 3;
            pointer-events: none;
        }

        .card-wrapper:hover .card::before {
            background-position: 100% 100%;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 9px;
            font-weight: bold;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 4px;
        }

        .card-rarity {
            background: #cbd5e1;
            color: black;
            padding: 1px 5px;
            border-radius: 2px;
            font-size: 8px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .card.rarity-legendaria .card-rarity {
            background: var(--gold);
            text-shadow: 0 0 2px white;
        }

        .card.rarity-especial .card-rarity {
            background: #00d2ff;
        }

        .card-logo-mini {
            width: 22px;
            height: 26px;
        }

        .card-photo-area {
            width: 100%;
            height: 125px;
            background: linear-gradient(to bottom, #192d47, #09131f);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            margin: 5px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .card-photo-area img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .card.rarity-legendaria .card-photo-area {
            background: linear-gradient(to bottom, #70041e, #000);
            border-color: rgba(255, 215, 0, 0.3);
        }

        .silhouette {
            width: 85px;
            height: 105px;
            fill: #ffffff;
            opacity: 0.15;
            z-index: 2;
        }

        /* Partículas de destellos internos solo para leyendas */
        .sparkle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--gold-light);
            border-radius: 50%;
            opacity: 0;
            animation: floatSparkle 2s infinite ease-in-out;
        }

        @keyframes floatSparkle {
            0% {
                transform: translateY(10px) scale(0);
                opacity: 0;
            }

            50% {
                opacity: 1;
                transform: translateY(-30px) scale(1.3);
                filter: drop-shadow(0 0 3px var(--gold));
            }

            100% {
                transform: translateY(-65px) scale(0);
                opacity: 0;
            }
        }

        .player-data {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 4px;
            text-align: center;
            z-index: 5;
        }

        .card.rarity-legendaria .player-data {
            border-color: rgba(255, 215, 0, 0.25);
            background: rgba(31, 0, 7, 0.6);
        }

        .player-name {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-meta {
            font-size: 8px;
            color: #a0aab5;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            margin-top: 4px;
            font-size: 9px;
        }

        .stat-el {
            background: rgba(255, 255, 255, 0.04);
            padding: 2px;
            border-radius: 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-num {
            color: #fff;
            font-weight: bold;
        }

        .card.rarity-legendaria .stat-num {
            color: var(--gold);
            text-shadow: 0 0 3px rgba(255, 215, 0, 0.4);
        }

        .card.rarity-especial .stat-num {
            color: #00d2ff;
        }

        .stat-lbl {
            font-size: 6.5px;
            color: #828e9a;
            text-transform: uppercase;
        }

        .info-text {
            margin-top: 20px;
            font-size: 13px;
            letter-spacing: 2px;
            color: #828e9a;
            text-transform: uppercase;
            font-weight: bold;
            animation: pulse 2.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }
        }

        /* --- LEGENDARY REVEAL --- */
        @keyframes stageShake {
            0%, 100% { transform: translateX(0); }
            10% { transform: translateX(-8px) rotate(-1deg); }
            20% { transform: translateX(8px) rotate(1deg); }
            30% { transform: translateX(-6px) rotate(-0.5deg); }
            40% { transform: translateX(6px) rotate(0.5deg); }
            50% { transform: translateX(-4px); }
            60% { transform: translateX(4px); }
            70% { transform: translateX(-2px); }
            80% { transform: translateX(2px); }
        }

        .stage.legendary-reveal {
            animation: stageShake 0.6s ease;
        }

        .legendary-particle {
            position: fixed;
            width: 8px;
            height: 8px;
            background: var(--gold);
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 0 6px var(--gold), 0 0 12px rgba(255, 215, 0, 0.5);
            animation: particleBurst 1s ease-out forwards;
        }

        @keyframes particleBurst {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) scale(0);
            }
        }

        .btn-reset {
            margin-top: 15px;
            padding: 8px 22px;
            background: transparent;
            border: 2px solid var(--gold);
            color: var(--gold);
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 11px;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }

        .stage.opened~.btn-reset {
            opacity: 1;
            pointer-events: auto;
        }

        .btn-reset:hover {
            background: var(--gold);
            color: black;
            box-shadow: 0 0 12px var(--gold);
        }

        .page-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            z-index: 50;
            pointer-events: none;
        }

        .header-left {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 6px;
            background: linear-gradient(
                to right,
                #ffffff 0%,
                #ffffff 25%,
                var(--gold-light) 40%,
                var(--gold) 50%,
                var(--gold-light) 60%,
                #ffffff 75%,
                #ffffff 100%
            );
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 3px rgba(0, 0, 0, 0.8));
            display: flex;
            align-items: center;
            gap: 10px;
            animation: headerShimmer 4s ease-in-out infinite;
        }

        @keyframes headerShimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
            display: block;
            -webkit-text-fill-color: initial;
            animation: spinLogo 3s linear infinite;
            transform-style: preserve-3d;
            perspective: 200px;
        }

        @keyframes spinLogo {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .header-right {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--gold-light);
            opacity: 0.7;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .album-nav {
            display: flex;
            gap: 12px;
            margin-top: 75px;
            margin-bottom: 5px;
            z-index: 10;
        }

        .album-nav a {
            padding: 8px 20px;
            border: 2px solid var(--gold);
            color: var(--gold);
            text-decoration: none;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .album-nav a:hover {
            background: var(--gold);
            color: black;
            box-shadow: 0 0 12px var(--gold);
        }

        .album-nav a.active {
            background: var(--gold);
            color: black;
        }

        .ball-spin {
            width: 28px;
            height: 28px;
            object-fit: contain;
            display: block;
            animation: spinBall 3s linear infinite;
        }

        @keyframes spinBall {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- STATS PANEL --- */
        .stats-panel {
            margin-top: 25px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 12px;
            padding: 14px 24px;
            min-width: 500px;
            backdrop-filter: blur(8px);
        }

        .stats-title {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 3px;
            color: var(--gold);
            text-align: center;
            margin-bottom: 10px;
            opacity: 0.7;
        }

        .stats-row {
            display: flex;
            justify-content: space-around;
            gap: 20px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .stat-icon {
            font-size: 14px;
            line-height: 1;
        }

        .stat-icon-normal { color: #cbd5e1; }
        .stat-icon-escudo { color: #a855f7; }
        .stat-icon-especial { color: #00d2ff; }
        .stat-icon-legendaria { color: var(--gold); }

        .stat-value {
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            line-height: 1.2;
        }

        .stat-label {
            font-size: 9px;
            font-weight: 600;
            color: #828e9a;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        /* --- PARTÍCULAS DE FONDO --- */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-5vh) scale(1); opacity: 0; }
        }

        /* --- EFECTO HOLO EN CARTAS --- */
        .card-wrapper:hover .card::before {
            background: linear-gradient(135deg,

        function crearParticulas() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                p.style.left = Math.random() * 100 + '%';
                const size = 1 + Math.random() * 3;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.animationDuration = (10 + Math.random() * 20) + 's';
                p.style.animationDelay = (Math.random() * 20) + 's';
                p.style.background = Math.random() > 0.7 ? 'var(--gold)' : 'rgba(255,255,255,0.6)';

            }

        // ALGORITMO GACHA (75% Normal, 15% Especial, 9% Escudo, 1% Legendaria)
        function generarCartasSobre() {
            const poolNormal = poolCartas.filter(c => c.rarity === "normal");
            const poolEspecial = poolCartas.filter(c => c.rarity === "especial");
            const poolEscudo = poolCartas.filter(c => c.rarity === "escudo");
            const poolLegendario = poolCartas.filter(c => c.rarity === "legendaria");

            let seleccionadas = [];

            for (let i = 0; i < 5; i++) {
                let dadoRareza = Math.random();
                let poolDisponible;

                if (dadoRareza < 0.75) {
                    poolDisponible = poolNormal;
                } else if (dadoRareza < 0.90) {
                    poolDisponible = poolEspecial;
                } else if (dadoRareza < 0.99) {
                    poolDisponible = poolEscudo;
                } else {
                    poolDisponible = poolLegendario;
                }

                let permiteRepetir = Math.random() < 0.20;
                let cartaCandidata;

                if (!permiteRepetir && seleccionadas.length > 0) {
                    let poolFiltrado = poolDisponible.filter(c => !seleccionadas.some(s => s.id === c.id));
                    if (poolFiltrado.length === 0) poolFiltrado = poolDisponible;
                    cartaCandidata = poolFiltrado[Math.floor(Math.random() * poolFiltrado.length)];
                } else {
                    cartaCandidata = poolDisponible[Math.floor(Math.random() * poolDisponible.length)];
                }
                seleccionadas.push(cartaCandidata);
            }
            return seleccionadas;
        }

        function crearBrillosEspeciales(contenedorFoto) {
            const numeroDeBrillos = 10;
            for (let i = 0; i < numeroDeBrillos; i++) {
                const brillo = document.createElement('div');
                brillo.classList.add('sparkle');
                brillo.style.left = `${Math.random() * 85 + 5}%`;
                brillo.style.bottom = `${Math.random() * 40}%`;
                brillo.style.animationDelay = `${Math.random() * 1.5}s`;
                contenedorFoto.appendChild(brillo);
            }
        }

        function triggerLegendaryReveal(cardWrapper, name) {
            const stage = document.getElementById('mainStage');
            stage.classList.remove('legendary-reveal');
            void stage.offsetWidth;
            stage.classList.add('legendary-reveal');
            setTimeout(() => stage.classList.remove('legendary-reveal'), 700);

            document.getElementById('hint').innerHTML = `¡LEYENDA! ${name} ✦`;

            const rect = cardWrapper.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.classList.add('legendary-particle');
                const angle = Math.random() * 360;
                const dist = 80 + Math.random() * 220;
                p.style.left = cx + 'px';
                p.style.top = cy + 'px';
                p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
                p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
                p.style.width = (4 + Math.random() * 6) + 'px';
                p.style.height = p.style.width;
                p.style.background = Math.random() > 0.5 ? 'var(--gold)' : '#fff';
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1200);
            }
        }

            const container = document.getElementById('cardsContainer');
            container.innerHTML = "";

            const cartasObtenidas = generarCartasSobre();

            // Guardar en álbum
            const idsActuales = JSON.parse(localStorage.getItem('hyperion_coleccion')) || [];

                if (!idsActuales.includes(c.id)) idsActuales.push(c.id);
            });
            localStorage.setItem('hyperion_coleccion', JSON.stringify(idsActuales));

            stats.packs++;
            cartasObtenidas.forEach(c => { stats[c.rarity]++; });
            actualizarStats();
            const fragment = document.createDocumentFragment();

            cartasObtenidas.forEach((carta, i) => {
                const wrapper = document.createElement('div');
                wrapper.classList.add('card-wrapper');

                const inner = document.createElement('div');
                inner.classList.add('card-inner');
                inner.style.animationDelay = `${0.15 + i * 0.12}s`;

                const front = document.createElement('div');
                front.classList.add('card-front');

                front.innerHTML = `
                    <div class="card rarity-${carta.rarity}${carta.fullImg ? ' full-img' : ''}"${carta.img ? ` style="border-color: ${carta.rarity === 'especial' ? '#00d2ff' : carta.rarity === 'escudo' ? '#a855f7' : carta.rarity === 'legendaria' ? '#ffd700' : '#cbd5e1'}"` : ''}>
                        ${carta.fullImg ? `<img class="card-bg-img" src="${carta.img}" alt="">` : ''}
                        <div class="card-header">
                            <span class="card-rarity">${carta.rarity}</span>
                            ${logoSVG}
                        </div>
                        <div class="card-photo-area">
                            ${carta.img && !carta.fullImg ? `<img src="${carta.img}" alt="">` : `<svg class="silhouette" viewBox="0 0 24 24"><path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z"/></svg>`}
                        </div>
                        <div class="player-data">
                            <div class="player-name">${carta.name}</div>
                            <div class="player-meta">${carta.meta}</div>
                            <div class="stats-grid">
                                <div class="stat-el"><span class="stat-num">${carta.s1.split(" ")[0]}</span><span class="stat-lbl">${carta.s1.split(" ")[1]}</span></div>
                                <div class="stat-el"><span class="stat-num">${carta.s2.split(" ")[0]}</span><span class="stat-lbl">${carta.s2.split(" ")[1]}</span></div>
                                <div class="stat-el"><span class="stat-num">${carta.s3.split(" ")[0]}</span><span class="stat-lbl">${carta.s3.split(" ")[1]}</span></div>
                            </div>
                        </div>
                    </div>
                `;

                const back = document.createElement('div');
                back.classList.add('card-back');
                back.innerHTML = `
                    <div class="card-back-logo">HYPERION</div>
                    <div class="card-back-title">MUNDIAL<br>DE CARTAS</div>
                    <div class="card-back-stars">&#9733; &#9733; &#9733;</div>
                    <div class="card-back-footer">EDICIÓN LIMITADA</div>
                `;

                inner.appendChild(front);
                inner.appendChild(back);
                wrapper.appendChild(inner);

                if (carta.rarity === 'legendaria') {
                    if (!carta.fullImg) {
                        const fotoArea = wrapper.querySelector('.card-photo-area');
                        if (fotoArea) crearBrillosEspeciales(fotoArea);
                    }
                    inner.addEventListener('animationend', () => {
                        triggerLegendaryReveal(wrapper, carta.name);
                    }, { once: true });
                }

                fragment.appendChild(wrapper);
            });

            container.appendChild(fragment);

            document.getElementById('mainStage').classList.add('opened');
            document.getElementById('hint').innerHTML = "¡Sobre abierto! Pasa el mouse para desplegar los brillos";
        }

        function closePack() {
            document.getElementById('mainStage').classList.remove('opened');
            document.getElementById('hint').innerHTML = "Haz clic en el sobre para abrirlo";
        }
    </script>
</body>

</html>
